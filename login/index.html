<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0907">
  <title>Account login unavailable | Project Glorp</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", Arial, sans-serif; background: #0b0907; color: #f5f1e8; }

    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0, #3a2b0d 0, transparent 48%), #0b0907; }
    main { width: min(620px, 100%); padding: 48px 32px; border: 1px solid #f5c54233; border-radius: 24px; background: #ffffff08; text-align: center; }
    .eyebrow { color: #f5c542; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; font-size: clamp(36px, 8vw, 64px); line-height: 1; }
    p { color: #a8a29e; line-height: 1.6; }
    a { display: inline-flex; margin-top: 20px; padding: 12px 20px; border-radius: 12px; background: linear-gradient(135deg, #f5c542, #d4a017); color: #1a1400; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 2px solid #f5c542; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Project Glorp</div>
    <h1>Backend not connected.</h1>
    <p>This GitHub Pages site is a static frontend. Discord login, purchases, gifts, and account codes will be available after the Project Glorp backend is deployed and connected.</p>
